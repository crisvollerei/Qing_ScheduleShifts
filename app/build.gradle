plugins {
    id 'com.android.application'
}

// 版本号集中在此处维护。
// versionCode 必须严格递增，否则覆盖安装会被系统拒绝（INSTALL_FAILED_VERSION_DOWNGRADE）；
// versionName 是展示给用户的版本，可与 code 不必一一对应。
def appVersionCode = 6
def appVersionName = "0.2.0"

// 签名凭据从本机 local.properties 或环境变量读取，避免密钥口令进入版本库。
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def signingValue = { String key -> localProperties.getProperty(key) ?: System.getenv(key) }
def releaseStoreFile = signingValue("RELEASE_STORE_FILE")
def releaseStorePassword = signingValue("RELEASE_STORE_PASSWORD")
def releaseKeyAlias = signingValue("RELEASE_KEY_ALIAS")
def releaseKeyPassword = signingValue("RELEASE_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
if (!hasReleaseSigning) {
    logger.lifecycle("未配置发布签名（local.properties / 环境变量 RELEASE_*），Release APK 将以未签名方式产出。")
}

android {
    namespace 'com.example.myapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.myapp"
        minSdk 21
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "app"
    productFlavors {
        original {
            dimension "app"
            applicationId "com.example.myapp"
            manifestPlaceholders = [appLabel: "清蒸排班"]
        }
        schedule {
            dimension "app"
            applicationId "com.example.schedule"
            manifestPlaceholders = [appLabel: "排班"]
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// 便捷任务：一次性编译所有变体的单元测试源码。
// 原实现引用了不存在的 compileDebugUnitTestSources，任务无法解析；此处指向真实的变体任务。
tasks.register("unitTestClasses") {
    dependsOn(
            "compileOriginalDebugUnitTestSources",
            "compileOriginalReleaseUnitTestSources",
            "compileScheduleDebugUnitTestSources",
            "compileScheduleReleaseUnitTestSources"
    )
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    // 两个布局均为 LinearLayout + WebView，未使用 ConstraintLayout，故不再引入。
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}